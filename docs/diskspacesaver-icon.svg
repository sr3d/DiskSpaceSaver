<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#0c1226"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="squircle-clip"><use href="#squircle"/></clipPath>
  </defs>

  <!-- macOS squircle -->
  <path id="squircle" d="M512 0C212 0 0 212 0 512s212 512 512 512 512-212 512-512S812 0 512 0z" fill="url(#bg)"/>
  <g clip-path="url(#squircle-clip)">
    <rect width="1024" height="1024" fill="url(#gloss)"/>
    <circle cx="512" cy="540" r="440" fill="url(#glow)"/>
  </g>

  <!-- Sunburst rings. Arc lengths are deliberately uneven, like a real scan. -->
  <g transform="translate(512 512)" fill="none" stroke-linecap="butt" filter="url(#shadow)">
    <!-- outer ring (r=380, w=110) -->
    <g stroke-width="110">
      <path d="M0 -380 A380 380 0 0 1 329 -190" stroke="#ff8a3d"/>
      <path d="M329 -190 A380 380 0 0 1 329 190" stroke="#ffb547"/>
      <path d="M329 190 A380 380 0 0 1 0 380" stroke="#5ad4ff"/>
      <path d="M0 380 A380 380 0 0 1 -329 190" stroke="#7b6cff"/>
      <path d="M-329 190 A380 380 0 0 1 -380 0" stroke="#ff5f7e"/>
      <!-- gap from -380,0 to 0,-380 = empty (free space) -->
    </g>
    <!-- middle ring (r=255, w=110) -->
    <g stroke-width="110">
      <path d="M0 -255 A255 255 0 0 1 221 -128" stroke="#ff6a1f"/>
      <path d="M221 -128 A255 255 0 0 1 255 0" stroke="#ff9a2e"/>
      <path d="M255 0 A255 255 0 0 1 128 221" stroke="#3ec2f2"/>
      <path d="M128 221 A255 255 0 0 1 -221 128" stroke="#6a5cf5"/>
      <path d="M-221 128 A255 255 0 0 1 -255 0" stroke="#f04d6f"/>
    </g>
    <!-- inner ring (r=130, w=110) -->
    <g stroke-width="110">
      <path d="M0 -130 A130 130 0 0 1 130 0" stroke="#e85a12"/>
      <path d="M130 0 A130 130 0 0 1 0 130" stroke="#2aa9dc"/>
      <path d="M0 130 A130 130 0 0 1 -130 0" stroke="#5a4be0"/>
    </g>
    <!-- ring separators for depth -->
    <g stroke="#0c1226" stroke-width="10" opacity="0.9">
      <circle r="325"/>
      <circle r="200"/>
      <circle r="75"/>
    </g>
  </g>

  <!-- Center: the reclaimed space, with a subtle checkmark -->
  <circle cx="512" cy="512" r="72" fill="#0c1226"/>
  <path d="M478 514 l24 24 l48 -52" fill="none" stroke="#5ad4ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
