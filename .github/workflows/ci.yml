name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Formatting
        run: test -z "$(gofmt -l . | grep -v '^frontend/')" || (gofmt -l .; exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
