name: Release

# Runs on a version tag and does the same work the local release script does,
# through the same Makefile, so a CI release and a desk release are the same
# bundle.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, e.g. 1.2.0
        required: true
      channel:
        description: stable or beta
        default: stable

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache: true }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Determine version
        id: v
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=${{ inputs.channel || 'stable' }}" >> "$GITHUB_OUTPUT"
          notes="docs/release-notes/$version.md"
          if [ ! -f "$notes" ]; then
            echo "missing $notes — users read it in the update prompt" >&2
            exit 1
          fi

      - name: Vendor Sparkle
        run: make sparkle

      # The certificate lives in a throwaway keychain that exists only for this
      # job, so nothing is left behind on a shared runner.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
        run: |
          keychain_password=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" build.keychain >/dev/null
          rm -f /tmp/cert.p12

      - name: Build, sign and verify
        env:
          SIGN_ID: ${{ secrets.SIGN_IDENTITY }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          make app VERSION=${{ steps.v.outputs.version }}
          make verify VERSION=${{ steps.v.outputs.version }}

      - name: Notarise and staple
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER: ${{ secrets.AC_API_ISSUER }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
        run: |
          echo "$AC_API_KEY" | base64 --decode > /tmp/ac.p8
          xcrun notarytool store-credentials diskspacesaver \
            --key /tmp/ac.p8 --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER"
          rm -f /tmp/ac.p8
          make notarize VERSION=${{ steps.v.outputs.version }}
          make staple VERSION=${{ steps.v.outputs.version }}
          # A release that Gatekeeper rejects is worse than no release: it
          # reaches users as a scary warning. Stop here rather than publish it.
          spctl --assess --type execute --verbose=2 dist/macos/DiskSpaceSaver.app

      - name: Sign the update
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          zip="dist/macos/DiskSpaceSaver-${{ steps.v.outputs.version }}.zip"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle.key
          out=$(./bin/sparkle/sign_update "$zip" -f /tmp/sparkle.key)
          rm -f /tmp/sparkle.key
          sig=$(sed -n 's/.*edSignature="\([^"]*\)".*/\1/p' <<<"$out")
          len=$(sed -n 's/.*length="\([0-9]*\)".*/\1/p' <<<"$out")
          if [ -z "$sig" ] || [ -z "$len" ]; then
            echo "could not read sign_update output: $out" >&2; exit 1
          fi
          echo "signature=$sig" >> "$GITHUB_OUTPUT"
          echo "length=$len" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.v.outputs.version }}
          args=""
          [ "${{ steps.v.outputs.channel }}" = "beta" ] && args="--prerelease"
          gh release create "v$v" "dist/macos/DiskSpaceSaver-$v.zip" \
            --title "DiskSpaceSaver $v" \
            --notes-file "docs/release-notes/$v.md" $args

      # Last, and only once the asset is actually downloadable: publishing the
      # feed first would offer users a version that does not yet exist.
      - name: Update the appcast
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          UPDATE_HOST: ${{ vars.UPDATE_HOST || 'https://updates.diskspacesaver.app' }}
        run: |
          v=${{ steps.v.outputs.version }}
          url="https://github.com/${{ github.repository }}/releases/download/v$v/DiskSpaceSaver-$v.zip"
          for i in $(seq 1 30); do
            curl -fsSLI -o /dev/null "$url" && break
            [ "$i" = 30 ] && { echo "asset never became downloadable" >&2; exit 1; }
            sleep 5
          done
          curl -fsS -X POST "$UPDATE_HOST/releases" \
            -H "authorization: Bearer $UPDATE_TOKEN" \
            -H 'content-type: application/json' \
            -d "$(jq -n \
                  --arg version "$v" \
                  --arg build "$(git rev-list --count HEAD)" \
                  --arg url "$url" \
                  --arg signature '${{ steps.sign.outputs.signature }}' \
                  --arg notes "$(cat docs/release-notes/$v.md)" \
                  --arg channel "${{ steps.v.outputs.channel }}" \
                  --argjson length ${{ steps.sign.outputs.length }} \
                  '{version:$version,build:$build,url:$url,length:$length,
                    signature:$signature,notes:$notes,channel:$channel,
                    minimumSystemVersion:"13.0"}')"
          curl -fsS "$UPDATE_HOST/appcast.xml?channel=${{ steps.v.outputs.channel }}" \
            | grep -q "$v" || { echo "the appcast does not list $v" >&2; exit 1; }

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain build.keychain || true
